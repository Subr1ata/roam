plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def dotenvPublishableKey = ""
def dotenvFile = rootProject.file(".env")
if (dotenvFile.exists()) {
    dotenvFile.eachLine { line ->
        def matcher = line =~ /^\s*CLERK_PUBLISHABLE_KEY\s*=\s*(.*?)\s*$/
        if (matcher.matches()) {
            def value = matcher.group(1).trim()
            if ((value.startsWith("\"") && value.endsWith("\"")) ||
                (value.startsWith("'") && value.endsWith("'"))) {
                value = value.substring(1, value.length() - 1)
            }
            dotenvPublishableKey = value
        }
    }
}
def clerkPublishableKey = (
    System.getenv("CLERK_PUBLISHABLE_KEY")
        ?: localProperties.getProperty("clerk.publishableKey")
        ?: dotenvPublishableKey
).trim().replace("\\", "\\\\").replace("\"", "\\\"")

android {
    namespace "com.roam.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.roam.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "CLERK_PUBLISHABLE_KEY", "\"${clerkPublishableKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.clerk:clerk-android-api:1.3.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}